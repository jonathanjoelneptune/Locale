name: Deploy Locale to GitHub Pages
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "src/data/events.json"
      - "src/data/places.json"
      - "src/data/organizers.json"
      - "src/data/series.json"
      - "src/data/entity-source-links.json"
      - "src/data/coverage.json"
      - "src/data/geocode-cache.json"
      - "src/data/venue-geocode-cache.json"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  predeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Validate architecture and generated data
        run: node scripts/validate-data.mjs
      - name: Validate delivery architecture
        run: node scripts/validate-delivery.mjs
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.55.0 leaflet@1.9.4
          npx playwright install --with-deps chromium
      - name: Run pre-deploy browser regression suite
        run: npx playwright test
  deploy:
    needs: predeploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build deterministic site
        run: |
          BUILD="${GITHUB_SHA::12}"
          rm -rf _site
          mkdir -p _site
          cp -R index.html styles src _site/
          sed -i "s|./styles/base.css|./styles/base.css?v=$BUILD|; s|./styles/app.css|./styles/app.css?v=$BUILD|; s|./src/app.js|./src/app.js?v=$BUILD|" _site/index.html
          sed -i "s|</head>|<meta name=\"locale-build\" content=\"$BUILD\"></head>|" _site/index.html
          node scripts/version-site-modules.mjs _site "$BUILD"
          cp _site/index.html _site/404.html
          find _site/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  postdeploy:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser smoke runner
        run: |
          npm install --no-save @playwright/test@1.55.0 leaflet@1.9.4
          npx playwright install --with-deps chromium
      - name: Verify deployed build marker
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          short="${EXPECTED_BUILD:0:12}"
          for i in {1..12}; do
            html="$(curl -fsSL "https://jonathanjoelneptune.github.io/Locale/?smoke=$RANDOM" || true)"
            if grep -q "locale-build.*$short" <<<"$html"; then exit 0; fi
            sleep 5
          done
          echo "Deployed build marker did not reach production" >&2
          exit 1
      - name: Verify document shell stays available
        run: |
          for i in {1..6}; do
            url="https://jonathanjoelneptune.github.io/Locale/?availability=$RANDOM"
            html="$(curl --connect-timeout 5 --max-time 12 -fsSL "$url")"
            grep -q 'id="localeBoot"' <<<"$html"
            grep -q 'Locale' <<<"$html"
            sleep 5
          done
      - name: Run focused post-deploy smoke test
        env:
          LOCALE_BASE_URL: https://jonathanjoelneptune.github.io/Locale/
        run: npx playwright test --grep "@smoke"
