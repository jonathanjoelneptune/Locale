name: Deploy Locale to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build deterministic site
        run: |
          BUILD="${GITHUB_SHA::12}"
          mkdir -p _site
          cp -R index.html styles src _site/
          sed -i "s|./styles/base.css|./styles/base.css?v=$BUILD|; s|./styles/app.css|./styles/app.css?v=$BUILD|; s|./src/app.js|./src/app.js?v=$BUILD|" _site/index.html
          sed -i "s|</head>|<meta name=\"locale-build\" content=\"$BUILD\"></head>|" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
