name: Deploy Locale to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build immutable deployment
        run: |
          BUILD="${GITHUB_SHA::12}"
          mkdir -p _site
          cp -R index.html styles src _site/
          mkdir -p _site/vendor
          curl --fail --retry 3 --location https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js -o _site/vendor/leaflet.js
          curl --fail --retry 3 --location https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css -o _site/vendor/leaflet.css
          sed -i "s|https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css|./vendor/leaflet.css?v=$BUILD|" _site/index.html
          sed -i "s|./styles/base.css|./styles/base.css?v=$BUILD|; s|./styles/app.css|./styles/app.css?v=$BUILD|; s|./src/app.js|./src/app.js?v=$BUILD|" _site/index.html
          sed -i "s|</head>|<meta name=\"locale-build\" content=\"$BUILD\"></head>|" _site/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path("_site/src/services/leaflet.js")
          p.write_text('export async function ensureLeaflet(){\n  if(window.L)return window.L;\n  await new Promise((resolve,reject)=>{\n    const s=document.createElement("script");\n    s.src="./vendor/leaflet.js";\n    s.onload=resolve;s.onerror=()=>reject(new Error("Local map library failed to load"));\n    document.head.appendChild(s);\n  });\n  if(!window.L)throw new Error("Map library unavailable");\n  return window.L;\n}\n') 
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
