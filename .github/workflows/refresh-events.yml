name: Refresh Locale events
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "src/data/regions.js"
      - "src/domain/event.js"
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh normalized event data
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node scripts/ingest.mjs
      - name: Validate generated event data
        run: node scripts/validate-data.mjs
      - name: Commit event changes
        id: commit
        run: |
          if git diff --quiet -- src/data/events.json src/data/coverage.json src/data/geocode-cache.json; then
            echo "No event changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "locale-events[bot]"
          git config user.email "locale-events[bot]@users.noreply.github.com"
          git add src/data/events.json src/data/coverage.json src/data/geocode-cache.json
          git commit -m "Refresh event data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy refreshed event snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
