name: Refresh Locale events
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "src/data/regions.js"
      - "src/domain/**"
  schedule:
    - cron: "11 * * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: locale-event-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh normalized event data
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node scripts/ingest.mjs
      - name: Validate generated event data
        run: node scripts/validate-data.mjs
      - name: Commit event changes
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- src/data/events.json src/data/places.json src/data/organizers.json src/data/series.json src/data/entity-source-links.json src/data/coverage.json src/data/geocode-cache.json src/data/venue-geocode-cache.json; then
            echo "No event changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "locale-events[bot]"
          git config user.email "locale-events[bot]@users.noreply.github.com"
          git add src/data/events.json src/data/places.json src/data/organizers.json src/data/series.json src/data/entity-source-links.json src/data/coverage.json src/data/geocode-cache.json src/data/venue-geocode-cache.json
          git commit -m "Refresh event data"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Reconcile derived state
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reconcile-state.yml --ref main
