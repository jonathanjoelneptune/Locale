name: Validate Locale
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: locale-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Validate architecture and generated data
        run: node scripts/validate-data.mjs
      - name: Validate delivery architecture
        run: node scripts/validate-delivery.mjs
      - name: Validate discovery architecture
        run: node scripts/validate-discovery.mjs
      - name: Reconcile derived diagnostics
        run: node scripts/reconcile-state.mjs
      - name: Validate coverage architecture
        run: node scripts/validate-coverage.mjs
      - name: Report neighborhood density
        run: node scripts/check-neighborhood-density.mjs
      - name: Build production artifact
        run: LOCALE_BUILD_ID=ci-test node scripts/build-site.mjs
      - name: Test registry domain
        run: node --test scripts/registry.test.mjs
      - name: Test event classification
        run: node --test scripts/event-classification.test.mjs
      - name: Test recurring local happenings
        run: node --test scripts/recurring-happenings.test.mjs
      - name: Test background discovery
        run: node --test scripts/discovery.test.mjs
      - name: Test workbook acquisition registry
        run: node --test scripts/acquisition.test.mjs
      - name: Test coverage metrics
        run: node --test scripts/coverage-dashboard.test.mjs
      - name: Test coverage-area grid
        run: node --test scripts/coverage-zones.test.mjs
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.55.0 leaflet@1.9.4
          npx playwright install --with-deps chromium
      - name: Run pre-deploy UI regression suite
        run: npx playwright test
