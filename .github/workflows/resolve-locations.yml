name: Resolve Locale locations
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/resolve-locations.mjs"
      - "scripts/location-quality.mjs"
      - "scripts/venue-geocode.mjs"
      - "src/data/regions.js"
      - ".github/workflows/resolve-locations.yml"
  schedule:
    - cron: "7 * * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: locale-location-resolution
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync latest location state
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "LOCATION_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Resolve queued venue locations
        id: resolve
        run: |
          node scripts/resolve-locations.mjs
          RESOLVED="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('src/data/location-resolution-coverage.json','utf8'));process.stdout.write(String(Number(x.run?.resolved||0)))")"
          echo "resolved_count=$RESOLVED" >> "$GITHUB_OUTPUT"
          if [ "$RESOLVED" -gt 0 ]; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild coverage diagnostics
        run: node scripts/build-coverage-dashboard.mjs
      - name: Commit location progress
        id: commit
        run: |
          FILES="src/data/venue-geocode-cache.json src/data/location-resolution-queue.json src/data/location-resolution-coverage.json src/data/coverage-dashboard.json"
          if git diff --quiet -- $FILES; then
            echo "No location-resolution changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$REMOTE_SHA" != "$LOCATION_BASE_SHA" ]; then
            UPSTREAM_LOCATION_CHANGES="$(git diff --name-only "$LOCATION_BASE_SHA" "$REMOTE_SHA" -- $FILES || true)"
            if [ -n "$UPSTREAM_LOCATION_CHANGES" ]; then
              echo "Location state changed upstream while this run was working:"
              echo "$UPSTREAM_LOCATION_CHANGES"
              echo "Discarding stale resolver output; the next hourly run will continue from newer state."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git config user.name "locale-locations[bot]"
          git config user.email "locale-locations[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Advance venue location resolution"
          git rebase origin/main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Refresh events with newly resolved locations
        if: steps.resolve.outputs.resolved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-events.yml --ref main
